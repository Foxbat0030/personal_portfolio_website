<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nilesh Mehta | B.Tech CSE Student & Web Developer</title>
<meta name="description" content="Portfolio of Nilesh Mehta, a B.Tech CSE student at JECRC University, Jaipur. Web development, MySQL, Python and Pandas projects.">
<meta name="keywords" content="Nilesh Mehta, portfolio, web developer, CSE student, JECRC University, Jaipur, Python, Pandas, MySQL">
<meta name="author" content="Nilesh Mehta">
<meta property="og:title" content="Nilesh Mehta | Portfolio">
<meta property="og:description" content="B.Tech CSE student building web apps and data projects.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== THEME COLORS: edit these to restyle the site ========== */
:root{--bg:#0b0d1a;--card:#141830;--text:#e7e9f5;--muted:#9aa0c0;--a1:#38bdf8;--a2:#a78bfa;--line:#252a4a;--nav:rgba(11,13,26,.8)}
[data-theme=light]{--bg:#f6f7fd;--card:#fff;--text:#161a33;--muted:#5a6085;--a1:#0284c7;--a2:#7c3aed;--line:#dfe2f3;--nav:rgba(246,247,253,.85)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--a1);outline-offset:3px}
.wrap{max-width:1050px;margin:auto;padding:0 22px}
section{padding:84px 0}
h2{font-size:2rem;margin-bottom:34px}
h2::after{content:"";display:block;width:56px;height:4px;margin-top:8px;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.grad{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Navbar */
nav{position:sticky;top:0;z-index:20;background:var(--nav);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font-weight:700}
#links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#links a{padding:6px 11px;border-radius:8px;color:var(--muted);font-size:.9rem;white-space:nowrap}
#links a.active,#links a:hover{color:var(--text);background:var(--card)}
#links a.active{box-shadow:inset 0 -2px var(--a1)}
#theme{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1rem;flex:none}
/* Hero */
#hero{position:relative;min-height:calc(100vh - 60px);display:flex;align-items:center;overflow:hidden;padding:40px 0;
background:linear-gradient(120deg,var(--bg),color-mix(in srgb,var(--a2) 18%,var(--bg)),color-mix(in srgb,var(--a1) 18%,var(--bg)),var(--bg));background-size:300% 300%;animation:shift 14s ease infinite}
@keyframes shift{50%{background-position:100% 50%}}
#bg{position:absolute;inset:0;width:100%;height:100%}
#hero .wrap{position:relative;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
#hero h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1.1;margin:6px 0 10px}
.role{font-size:1.5rem;min-height:2.2rem;color:var(--a1);font-weight:500}
.role::after{content:"|";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.tag{color:var(--muted);max-width:480px;margin:12px 0 26px}
.btn{display:inline-block;padding:12px 24px;border-radius:10px;font-weight:700;border:0;cursor:pointer;font:inherit;font-weight:700;transition:transform .2s,box-shadow .2s}
.btn.p{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff}
.btn.s{border:2px solid var(--a1);color:var(--text);background:transparent}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px color-mix(in srgb,var(--a2) 40%,transparent)}
.btns{display:flex;gap:14px;flex-wrap:wrap}
#laptop{width:100%;max-width:380px;justify-self:center;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-16px)}}
/* About */
.about{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:center}
.photo{width:210px;height:210px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--a1),var(--a2))}
.photo div{width:100%;height:100%;border-radius:50%;background:var(--card) center/cover;display:grid;place-items:center;color:var(--muted);font-size:.85rem;text-align:center}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fact small{color:var(--muted);display:block}
/* Skills */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);border-color:var(--a1);box-shadow:0 12px 30px color-mix(in srgb,var(--a1) 18%,transparent)}
.card h3{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:1.05rem}
.card h3 svg{width:26px;height:26px;stroke:var(--a1);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{margin-bottom:11px}
.chip span{display:flex;justify-content:space-between;font-size:.88rem}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width 1.2s ease}
/* Projects */
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
.tags b{font-weight:500;font-size:.78rem;padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--a2) 18%,transparent);color:var(--a2)}
.card p{color:var(--muted);font-size:.93rem}
.plinks{display:flex;gap:16px;font-weight:700;font-size:.9rem}
.plinks a{color:var(--a1)}
.plinks a:hover{text-decoration:underline}
/* Timeline */
.tl{border-left:3px solid var(--line);padding-left:26px;margin-left:8px}
.tl .item{position:relative;margin-bottom:26px}
.tl .item::before{content:"";position:absolute;left:-36px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--a1);box-shadow:0 0 0 4px var(--bg),0 0 12px var(--a1)}
.tl small{color:var(--a1)}
.tl p{color:var(--muted)}
/* Achievements, resume, contact */
.ach li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line)}
.ach li::before{content:"★ ";color:var(--a2)}
#preview{width:100%;height:480px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:20px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:34px}
.contact a.l{display:block;padding:8px 0;color:var(--a1)}
form{display:grid;gap:12px}
input,textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
input:focus,textarea:focus{border-color:var(--a1);outline:0}
footer{text-align:center;color:var(--muted);padding:26px;border-top:1px solid var(--line);font-size:.9rem}
/* Fade-in on scroll */
.fade{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
.fade.show{opacity:1;transform:none}
@media(max-width:760px){#hero .wrap,.about,.contact{grid-template-columns:1fr}#laptop{max-width:260px;order:-1}.about{justify-items:center;text-align:center}.logo{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fade{opacity:1;transform:none}}
</style>
</head>
<body>
<nav><div class="wrap"><a href="#hero" class="logo grad" id="logo"></a><div id="links"></div><button id="theme" aria-label="Toggle dark or light mode">🌙</button></div></nav>

<header id="hero">
  <canvas id="bg"></canvas>
  <div class="wrap">
    <div>
      <p style="color:var(--muted)">Hi, I'm</p>
      <h1 class="grad" id="name"></h1>
      <div class="role" id="typed"></div>
      <p class="tag" id="tagline"></p>
      <div class="btns">
        <a class="btn p" href="resume.pdf" download>Download Resume</a>
        <a class="btn s" href="#projects">View Projects</a>
      </div>
    </div>
    <!-- Floating laptop illustration (inline SVG) -->
    <svg id="laptop" viewBox="0 0 320 240" role="img" aria-label="Laptop showing code">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      <rect x="50" y="20" width="220" height="140" rx="10" fill="#141830" stroke="url(#g)" stroke-width="4"/>
      <circle cx="68" cy="36" r="4" fill="#f87171"/><circle cx="82" cy="36" r="4" fill="#fbbf24"/><circle cx="96" cy="36" r="4" fill="#34d399"/>
      <g stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M70 62h50" stroke="#38bdf8"/><path d="M130 62h60" stroke="#a78bfa"/>
        <path d="M84 82h70" stroke="#a78bfa"/><path d="M164 82h40" stroke="#34d399"/>
        <path d="M84 102h40" stroke="#38bdf8"/><path d="M134 102h70" stroke="#fbbf24"/>
        <path d="M70 122h30" stroke="#34d399"/><path d="M110 122h60" stroke="#38bdf8"/>
      </g>
      <path d="M30 168h260l-16 30H46z" fill="url(#g)" opacity=".9"/>
      <text x="16" y="70" fill="#38bdf8" font-size="28" font-family="monospace">&lt;/&gt;</text>
      <text x="262" y="200" fill="#a78bfa" font-size="26" font-family="monospace">{ }</text>
    </svg>
  </div>
</header>

<main>
<section id="about"><div class="wrap fade">
  <h2>About</h2>
  <div class="about">
    <!-- PHOTO: put your photo file next to index.html and set config.photo below -->
    <div class="photo"><div id="photo">Your photo<br>here</div></div>
    <div><p id="bio"></p><div class="facts" id="facts"></div></div>
  </div>
</div></section>

<section id="skills"><div class="wrap fade"><h2>Skills</h2><div class="grid" id="skillGrid"></div></div></section>
<section id="projects"><div class="wrap fade"><h2>Projects</h2><div class="grid" id="projGrid"></div></div></section>
<section id="education"><div class="wrap fade"><h2>Education</h2><div class="tl" id="edu"></div></div></section>
<section id="achievements"><div class="wrap fade"><h2>Achievements &amp; Certifications</h2><ul class="ach" id="ach"></ul></div></section>

<section id="resume"><div class="wrap fade">
  <h2>Resume</h2>
  <!-- Preview loads resume.pdf from the same folder -->
  <iframe id="preview" src="resume.pdf" title="Resume preview"></iframe>
  <a class="btn p" href="resume.pdf" download>Download Resume (PDF)</a>
</div></section>

<section id="contact"><div class="wrap fade">
  <h2>Contact</h2>
  <div class="contact">
    <div id="clinks"></div>
    <!-- Simple form: opens the visitor's email app with the message filled in -->
    <form id="form">
      <input id="fn" placeholder="Your name" required>
      <input id="fe" type="email" placeholder="Your email" required>
      <textarea id="fm" rows="5" placeholder="Your message" required></textarea>
      <button class="btn p" type="submit">Send message</button>
    </form>
  </div>
</div></section>
</main>
<footer id="foot"></footer>

<script>
/* =====================================================================
   CONFIG: edit everything about you here. No need to touch the code below.
   ===================================================================== */
const CONFIG = {
  name: "Nilesh Mehta",
  roles: ["CSE Student", "Web Developer", "Problem Solver"],   // typing animation
  tagline: "2nd-year B.Tech CSE student building web apps and data projects. Open to internships, hackathons, open-source and freelance work.",
  photo: "",   // e.g. "me.jpg" (put the image in the same folder)
  bio: "I'm a B.Tech CSE student at JECRC University in Jaipur with a keen interest in web development, MySQL and data analysis with Pandas. I like turning small ideas into working projects and I'm looking for internships, hackathons, open-source and freelance opportunities.",
  facts: [["College","JECRC University"],["CGPA","8.8"],["Year","2nd year (2025–29)"],["Location","Jaipur, India"]],
  email: "Nilesh.cse@yahoo.com",
  linkedin: "https://nileshmehta.linkedin.in",   // check: LinkedIn URLs normally look like https://www.linkedin.com/in/yourname
  github: "https://github.foxbat30",              // check: normally https://github.com/yourusername
  skills: {   // level = 0-100 bar fill
    "Languages": {icon:"M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12", items:[["C",80],["C++",90],["Python",80]]},
    "Web": {icon:"M3 5h18v14H3zM3 9h18", items:[["HTML",90],["CSS",85],["JavaScript",75],["React",60]]},
    "Tools": {icon:"M14 6l4 4-8 8H6v-4zM13 7l4 4", items:[["Git",80],["GitHub",80],["VS Code",90],["MySQL",75]]},
    "CS Fundamentals": {icon:"M12 3l9 5-9 5-9-5zM3 13l9 5 9-5", items:[["DSA",85],["OOP",80],["DBMS",75],["OS",70]]}
  },
  projects: [
    {title:"Student Record Management System", desc:"A C++ console application to add, search, update and delete student records with file-based storage.", tech:["C++","File I/O","OOP"], github:"https://github.com/", demo:"#"},
    {title:"Sales Data Analysis", desc:"Exploratory analysis of a retail sales dataset using Python, Pandas and SQL to uncover trends and top-performing products.", tech:["Python","Pandas","SQL"], github:"https://github.com/", demo:"#"},
    {title:"Project 3 (add your own)", desc:"What it does, the tech you used and one result or impact.", tech:["HTML","CSS","JavaScript"], github:"https://github.com/", demo:"#"}
  ],
  education: [
    {when:"2025 – 2029", title:"B.Tech, Computer Science & Engineering", place:"JECRC University, Jaipur", note:"CGPA: 8.8"},
    {when:"2024", title:"Class 12 (CBSE)", place:"", note:"79%"},
    {when:"2022", title:"Class 10 (CBSE)", place:"", note:"94.3%"}
  ],
  achievements: [   // replace with your real ones
    "Hackathon: add name, year and result",
    "Coding contests: add your LeetCode / CodeChef rating",
    "Certificate: add NPTEL / Coursera course name and year"
  ]
};

/* ===================== Code below: edit only if you like ===================== */
const $ = s => document.querySelector(s);
const C = CONFIG;
const li = (href,txt) => `<a class="l" href="${href}" target="_blank" rel="noopener">${txt}</a>`;

// Basic text
document.title = C.name + " | Portfolio";
$("#name").textContent = C.name;
$("#logo").textContent = "<" + C.name.split(" ")[0] + "/>";
$("#tagline").textContent = C.tagline;
$("#bio").textContent = C.bio;
$("#foot").textContent = "© " + new Date().getFullYear() + " " + C.name;
if (C.photo) { $("#photo").style.backgroundImage = `url(${C.photo})`; $("#photo").textContent = ""; }
$("#facts").innerHTML = C.facts.map(f => `<div class="fact"><small>${f[0]}</small>${f[1]}</div>`).join("");

// Navbar links
["about","skills","projects","education","achievements","resume","contact"].forEach(id => {
  $("#links").insertAdjacentHTML("beforeend", `<a href="#${id}" data-id="${id}">${id[0].toUpperCase()+id.slice(1)}</a>`);
});

// Skills
$("#skillGrid").innerHTML = Object.entries(C.skills).map(([g,v]) => `
  <div class="card"><h3><svg viewBox="0 0 24 24"><path d="${v.icon}"/></svg>${g}</h3>
  ${v.items.map(i => `<div class="chip"><span>${i[0]}<em>${i[1]}%</em></span><div class="bar"><i data-w="${i[1]}"></i></div></div>`).join("")}</div>`).join("");

// Projects
$("#projGrid").innerHTML = C.projects.map(p => `
  <div class="card"><h3>${p.title}</h3><p>${p.desc}</p>
  <div class="tags">${p.tech.map(t => `<b>${t}</b>`).join("")}</div>
  <div class="plinks"><a href="${p.github}" target="_blank" rel="noopener">GitHub</a><a href="${p.demo}" target="_blank" rel="noopener">Live demo</a></div></div>`).join("");

// Education, achievements, contact
$("#edu").innerHTML = C.education.map(e => `<div class="item"><small>${e.when}</small><h3>${e.title}</h3><p>${[e.place,e.note].filter(Boolean).join(" · ")}</p></div>`).join("");
$("#ach").innerHTML = C.achievements.map(a => `<li>${a}</li>`).join("");
$("#clinks").innerHTML = `<p style="color:var(--muted)">Open to internships, hackathons, open-source and freelance projects. Say hello:</p>`
  + li("mailto:" + C.email, "✉ " + C.email) + li(C.linkedin, "in LinkedIn") + li(C.github, "⌥ GitHub");
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const body = encodeURIComponent($("#fm").value + "\n\nFrom: " + $("#fn").value + " (" + $("#fe").value + ")");
  location.href = `mailto:${C.email}?subject=${encodeURIComponent("Portfolio message from " + $("#fn").value)}&body=${body}`;
});

// Typing animation
let ri = 0, ci = 0, del = false;
(function type() {
  const w = C.roles[ri];
  $("#typed").textContent = w.slice(0, ci += del ? -1 : 1);
  let t = del ? 45 : 95;
  if (!del && ci === w.length) { del = true; t = 1400; }
  else if (del && ci === 0) { del = false; ri = (ri + 1) % C.roles.length; t = 300; }
  setTimeout(type, t);
})();

// Theme toggle (remembers choice)
const root = document.documentElement;
function setTheme(t) { root.dataset.theme = t; $("#theme").textContent = t === "dark" ? "🌙" : "☀️"; try { localStorage.setItem("theme", t); } catch (e) {} }
let saved = null; try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || "dark");
$("#theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

// Fade-in on scroll + animate skill bars
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("show"); e.target.querySelectorAll(".bar i").forEach(b => b.style.width = b.dataset.w + "%"); }
}), { threshold: .15 });
document.querySelectorAll(".fade").forEach(el => io.observe(el));

// Active section highlight in navbar
const so = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) document.querySelectorAll("#links a").forEach(a => a.classList.toggle("active", a.dataset.id === e.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main section").forEach(s => so.observe(s));

// Hero particle background
(function () {
  const cv = $("#bg"), x = cv.getContext("2d"); let W, H, P = [];
  function size() { W = cv.width = cv.offsetWidth; H = cv.height = cv.offsetHeight; P = Array.from({ length: Math.min(70, W / 14) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5 })); }
  function draw() {
    x.clearRect(0, 0, W, H);
    const col = getComputedStyle(root).getPropertyValue("--a1").trim();
    x.fillStyle = x.strokeStyle = col;
    P.forEach((p, i) => {
      p.x = (p.x + p.vx + W) % W; p.y = (p.y + p.vy + H) % H;
      x.globalAlpha = .7; x.beginPath(); x.arc(p.x, p.y, 2, 0, 6.3); x.fill();
      for (let j = i + 1; j < P.length; j++) {
        const d = Math.hypot(p.x - P[j].x, p.y - P[j].y);
        if (d < 110) { x.globalAlpha = (1 - d / 110) * .35; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(P[j].x, P[j].y); x.stroke(); }
      }
    });
    requestAnimationFrame(draw);
  }
  addEventListener("resize", size); size(); draw();
})();
</script>
</body>
</html>
